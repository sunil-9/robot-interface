[project]
name = "mybridge"
version = "0.1.0"
description = "Robot Teaching Interface Backend - WebSocket Bridge for ROS2 with FastAPI"
readme = "README.md"
authors = [
    { name = "sunil-9", email = "sunil.sapkota@imitationmachines.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.117.1",
    "numpy>=2.2.6",
    "opencv-python>=4.11.0.86",
    "uvicorn[standard]>=0.30.0",
    "websockets>=15.0.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "aiortc>=1.9.0",
    "av>=12.3.0",
]

[project.scripts]
mybridge = "mybridge:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0", 
    "httpx>=0.24.0",
    "websockets>=12.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

# Note: Use direct UV commands instead of scripts
# Example: uv run uvicorn mybridge.main:app --reload --host 0.0.0.0 --port 8080
